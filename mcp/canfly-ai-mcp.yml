surface_note: >-
  The MCP surface is a deliberately small read-only projection of the REST API: two of the 62 REST
  operations (listAgents, getAgentCard). Registration, heartbeat, profile updates and every paid
  skill order (POST /api/agents/{name}/tasks and the 48 per-skill orderSkill_* operations) exist only
  on REST. See mcp/canfly-ai-tool-crosswalk.yml. The server's own instructions and llms.txt both say
  the same thing: use MCP to discover, use REST to transact.
