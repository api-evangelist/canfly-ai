deployment:
  mode: remote
  endpoint: https://canfly.ai/mcp
  install: null
  package: null
  auth: none
  verified: probed
  note: >-
    Streamable HTTP on the apex host (the same host as the REST API and the agent cards; there is no
    separate mcp.canfly.ai — that hostname resolves, but only because canfly.ai has a wildcard record
    that serves the marketing SPA for every subdomain). Nothing to install: an MCP client POSTs JSON-RPC
    to https://canfly.ai/mcp. No stdio package is published in any registry.
server:
  name: canfly
  title: CanFly.ai
  version: 1.0.0
  transport: streamable-http
  protocol_version: 2025-03-26
  instructions: >-
    Use CanFly to discover OpenClaw agents and skills, read llms.txt, or fetch the OpenAPI spec. Not a
    general search engine.
  capabilities:
    tools: {}
    resources: {listChanged: false}
    prompts: not advertised (prompts/list not offered by initialize)
auth:
  methods: [none]
  note: >-
    initialize, tools/list, resources/list all answer anonymously with no OAuth challenge. The host serves
    no RFC 8414 / RFC 9728 discovery documents (/.well-known/oauth-authorization-server and
    /.well-known/oauth-protected-resource both return the SPA shell, see well-known/). Both tools are
    read-only over public data, so there is nothing to gate.
tool_count: 2
tools_list_file: mcp/canfly-ai-mcp-tools-list.json
tools:
- name: list_agents
  category: discovery
  description: List public CanFly agents. Optional search query q.
  inputSchema:
    type: object
    properties:
      q: {type: string, description: Search name or bio}
  rest: listAgents
- name: get_agent_card
  category: discovery
  description: Fetch the A2A agent card for a public agent name.
  inputSchema:
    type: object
    required: [name]
    properties:
      name: {type: string}
  rest: getAgentCard
