limit_count: 5
summary: >-
  Every /api response carries BOTH the IETF draft RateLimit headers (RateLimit-Limit, RateLimit-Policy,
  RateLimit-Remaining, RateLimit-Reset) and the legacy X-RateLimit-* trio, which is the runtime signal an
  agent needs. The observed policy is 300 requests per 3600-second window, per client (IP; no key was sent).
  The provider's llms-full.txt (dated 2026-04-05) publishes four narrower per-route limits that do not match
  the observed headers; both are recorded and the live headers are treated as authoritative for the read
  routes.
headers:
  observed:
    RateLimit-Limit: '300'
    RateLimit-Policy: '300;w=3600'
    RateLimit-Remaining: '298 (decrements per request)'
    RateLimit-Reset: '599 (seconds to window reset)'
    X-RateLimit-Limit: '300'
    X-RateLimit-Remaining: '298'
    X-RateLimit-Reset: '1789873200 (unix epoch of window reset)'
  documented_on_429: [Retry-After, 'RateLimit-*']
  note: >-
    The same counter is shared across the read routes, the versioned /api/v1 alias and the write routes we
    touched (a 401 and a 400 both decremented it), so the window is per-client across the whole /api surface.
    The OpenAPI declares no response headers at all; the headers are discoverable only by calling.
