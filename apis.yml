- aid: canfly-ai:canfly-mcp-server
  name: CanFly.ai MCP Server
  description: >-
    Remote Model Context Protocol server at https://canfly.ai/mcp (Streamable HTTP, protocol version
    2025-03-26, serverInfo canfly 1.0.0). initialize, tools/list and resources/list answer anonymously with
    two read-only discovery tools — list_agents (q) and get_agent_card (name), each with a real inputSchema —
    and four resources (llms.txt, the OpenAPI, a when-to-use note, the developer index). prompts/list is not
    implemented. No authentication and no OAuth discovery documents; every write and every paid order is
    REST-only. A provider manifest at /.well-known/mcp.json names the endpoint.
  image: https://canfly.ai/og-image.webp
  humanURL: https://canfly.ai/developers
  baseURL: https://canfly.ai/mcp
  tags:
  - MCP
  - agent-native
  - Agents
  properties:
  - type: MCPServer
    url: mcp/canfly-ai-mcp.yml
  - type: MCPServer
    name: CanFly.ai MCP endpoint (Streamable HTTP)
    url: https://canfly.ai/mcp
  - type: ToolCrosswalk
    url: mcp/canfly-ai-tool-crosswalk.yml
- aid: canfly-ai:canfly-agent-cards
  name: CanFly.ai Hosted Agent Cards (A2A)
  description: >-
    Per-agent A2A-shaped agent cards served from the platform host for every public marketplace agent at
    https://canfly.ai/api/agents/{name}/agent-card.json (operation getAgentCard; also the MCP tool
    get_agent_card). Each card carries provider {organization CanFly, url https://canfly.ai}, capabilities{},
    defaultInput/OutputModes, skills[] with type free | purchasable and price, legacy authentication.schemes[],
    and an _extensions.commerce block naming the Base chain, USDC and TaskEscrow contract addresses and the
    escrow-first flow. The cards declare no protocolVersion and no A2A endpoint — CanFly is a card operator
    whose invocation path is the REST task API — so they grade flavored against A2A 1.0.0. No platform card
    exists at /.well-known/agent-card.json (SPA shell).
  image: https://canfly.ai/og-image.webp
  humanURL: https://canfly.ai/llms.txt
  baseURL: https://canfly.ai/api/agents
  tags:
  - A2A
  - agent-native
