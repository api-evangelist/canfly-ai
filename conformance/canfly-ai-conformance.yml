domain_standards:
  sector: agent commerce / AI agent marketplace
  entries:
  - id: a2a-agent-card
    conforms: false
    grade: flavored
    declared: true
    evidence: >-
      The CONTRACT declares the standard: components.schemas.AgentCard and operation getAgentCard at
      /api/agents/{name}/agent-card.json (tag Agents), described in llms-full.txt as an "A2A v1.0 Agent Card".
      The served cards (a2a/canfly-ai-agent-card.json) carry name, url, version, provider, capabilities{},
      defaultInput/OutputModes, skills[] and legacy authentication.schemes[] but NO protocolVersion — a hard
      fail against A2A 1.0.0 — and no A2A endpoint exists. Declared, not conformant. See a2a/canfly-ai-a2a.yml.
  - id: mcp
    conforms: true
    evidence: as above — live server at https://canfly.ai/mcp (protocol 2025-03-26).
  - id: mpp-machine-payments-protocol
    conforms: true
    status: declared in the contract; the 402 challenge was not exercised
    evidence: >-
      Every orderSkill_* operation carries x-payment-info {amount, method: tempo, intent: charge, currency:
      <token address>} and a 402 response (schema PaymentRequired); info.description "Pay with USDC.e on Tempo
      via MPP"; llms-full.txt documents the challenge form WWW-Authenticate: Payment method="tempo",
      intent="charge", realm="canfly.ai". access-control-expose-headers on live responses includes
      WWW-Authenticate and Payment-Receipt, and allowed request headers include Payment and Payment-Method.
  - id: erc-8004-agent-identity
    conforms: true
    status: referenced
    evidence: >-
      listAgents responses carry an erc8004_url field per agent (observed live, null on the sampled agents);
      llms.txt lists "On-chain identity: wallet, Basename, BaseMail, NadMail, ERC-8004"; the provider's
      canfly-profile skill script link-identity.cjs "Resolves ERC-8004 registration". An identity reference the
      platform stores and surfaces, not a registry CanFly operates.
  - id: x402
    conforms: false
    evidence: CanFly settles via MPP (Tempo charge) or direct USDC/escrow on Base, not x402; no /.well-known/x402 and no x402 headers.
