summary: >-
  Where CanFly conforms it conforms in the contract and on the wire: RFC 9457 problem details (declared on
  all 62 operations and observed live), IETF RateLimit headers (observed live on every response), a
  published RFC 8594 Deprecation/Sunset commitment, MCP 2025-03-26 (probed), an OpenAI ai-plugin.json
  manifest and llms.txt. Its domain standards are the agent-commerce set — A2A-shaped agent cards declared
  in the contract, MCP, the Machine Payments Protocol over HTTP 402 and ERC-8004 identity references — with
  one honest gap: the cards omit protocolVersion and so do not pass A2A hard checks. No OAuth, OIDC,
  idempotency keys, webhook signing or enterprise standards (SCIM/OData/FHIR/PSD2/FAPI).
standards:
- id: openapi-3.1
  conforms: true
  evidence: 'openapi: "3.1.0" at https://canfly.ai/api/openapi.json (62 operations, 61 paths; byte-identical at /api/v1/openapi.json); parses and every operation carries an operationId'
- id: rfc9457-problem-details
  conforms: true
  evidence: >-
    components.schemas.Problem {type uri, title, status, code, detail, error, hint} declared on the 400/401/404/429/500
    of every operation with media type application/problem+json; OBSERVED live 2026-09-19 on a 400, a 401 and two
    404s, all Content-Type application/problem+json; charset=utf-8. See errors/canfly-ai-problem-types.yml.
- id: ietf-ratelimit-headers
  conforms: true
  evidence: >-
    RateLimit-Limit: 300, RateLimit-Policy: 300;w=3600, RateLimit-Remaining, RateLimit-Reset observed on every
