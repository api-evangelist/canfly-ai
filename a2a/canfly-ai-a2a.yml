discovery:
  path: /api/agents/{name}/agent-card.json
  canonical: false
  host: canfly.ai
  note: >-
    CanFly is an A2A card OPERATOR, not an A2A agent. It serves one card per hosted marketplace agent at
    /api/agents/{name}/agent-card.json (a documented, contract-declared operation: getAgentCard in
    openapi/canfly-ai-openapi.yml; the MCP tool get_agent_card returns the same document). There is NO
    platform card at either well-known path: /.well-known/agent-card.json and /.well-known/agent.json
    both answer HTTP 200 with the 6,668-byte marketing SPA shell (text/html), the same body every unknown
    /.well-known/* path gets, so those are misses, not hits (see well-known/canfly-ai-well-known.yml).
    The card saved here is the one a2aregistry.org lists under author "CanFly" (agent corsoai10puntate),
    which is how the provider entered the harvest backlog; it was fetched directly from canfly.ai.
    Every card the platform serves carries provider.organization "CanFly" / provider.url https://canfly.ai
    and the identical _extensions.commerce block (Base chainId 8453, USDC and TaskEscrow contract
    addresses), so the platform-level shape below holds for the whole fleet, while the name, description,
    skills and wallet describe the hosted third-party agent.
