conformance:
  spec: A2A 1.0.0
  grade: flavored
  protocol_version: null
  preferred_transport: null
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: false
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: >-
    capabilities is an object (pass) and skills is an array (pass), but protocolVersion is absent at the
    top level (hard fail), so the card grades flavored. It is shaped like the pre-0.3 Google A2A card
    (top-level url + authentication.schemes[] + provider) and the platform's own llms-full.txt calls it
    "A2A v1.0 Agent Card", but it declares no protocol version, no transport, no supportedInterfaces[]
    and no securitySchemes, and the card's url is the agent's HTML profile page rather than an A2A
    JSON-RPC endpoint.
  deviations:
  - field: protocolVersion
    observed: absent
    note: Hard fail against A2A 1.0.0 and 0.3.0 alike; an A2A client cannot tell which revision to speak.
  - field: url
    observed: https://canfly.ai/free/agent/corsoai10puntate (text/html profile page)
    note: >-
      A2A expects the agent's service endpoint. No JSON-RPC A2A endpoint exists on the platform: the
      actual invocation path is the REST operation createAgentTask (POST /api/agents/{name}/tasks),
      which the card does not reference. The card is a discovery document for a REST/escrow commerce
      flow, not for an A2A message channel.
  - field: authentication.schemes
    observed: '["none"] (legacy field); securitySchemes/security absent'
    note: The pre-0.3 field name. Payment (USDC on Base via the escrow contract, or MPP over HTTP 402) is the real gate on purchasable skills and is described only in _extensions.commerce.
  - field: skills[].tags / examples / inputModes
    observed: tags empty on every skill; no examples, no per-skill modes
    note: Skills carry id, name, description, url and a non-standard type (free | purchasable).
  - field: _extensions
    observed: platform, model, agentbookRegistered, birthday, canflyUrl, heartbeat, milestones, commerce
    note: >-
      Non-standard block carrying the commerce contract (chain, USDC and TaskEscrow addresses, deposit
      ABI, escrow-first flow), liveness and identity — the most useful content in the card for a buyer,
      and entirely outside the A2A schema.
  - field: preferredTransport / supportedInterfaces / documentationUrl / iconUrl / signatures
    observed: absent
    note: No transport declared, no documentation link (developers page and OpenAPI are not referenced), no JWS signature — authenticity rests on TLS to canfly.ai.
surface_relationship:
  note: >-
    Three agent surfaces on one host, all projections of one marketplace database: REST (62 operations,
    the only surface that writes or takes payment), MCP (2 read-only discovery tools, see
    mcp/canfly-ai-mcp.yml), and per-agent A2A-shaped cards (discovery only; no A2A endpoint). The card's
    skills correspond to the OpenAPI's per-skill orderSkill_* operations for purchasable skills; free
    skills such as this agent's two link out to the seller's own site.
