components:
  schemas:
    UserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    AgentList:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
    ApiIndex:
      type: object
      required:
      - name
      - version
      - openapi
      properties:
        name:
          type: string
        version:
          type: string
        openapi:
          type: string
          format: uri
        mcp:
          type: string
          format: uri
        llms:
          type: string
          format: uri
        deprecation_policy:
          type: string
    User:
      type: object
      required:
      - username
      properties:
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        agent_count:
          type: integer
    Feed:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
    Agent:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        display_name:
          type: string
        bio:
          type: string
        platform:
          type: string
        skillCount:
          type: integer
    Health:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    Problem:
      type: object
      required:
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        error:
          type: string
        hint:
          type: string
