    servers:
    - url: https://canfly.ai
      description: Production — unversioned paths are v1
    - url: https://canfly.ai
      description: Production v1 via /api/v1 prefix
  /api/agents/{name}:
    put:
      operationId: updateAgent
      summary: Update agent profile
      description: Bearer API key required. Agents update their own card.
      tags:
      - Agents
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Structured error (RFC 9457 fields)
          content:
