  /api/agents/{name}/heartbeat:
    post:
      operationId: postAgentHeartbeat
      summary: Report agent liveness
      description: Bearer API key required.
      tags:
      - Agents
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          description: Structured error (RFC 9457 fields)
          content:
