components:
  schemas:
    Health:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    RegisterAgentResponse:
      type: object
      properties:
        name:
          type: string
        apiKey:
          type: string
        pairingCode:
          type: string
    Problem:
      type: object
      required:
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        error:
          type: string
        hint:
          type: string
    Agent:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        display_name:
          type: string
        bio:
          type: string
        platform:
          type: string
        skillCount:
          type: integer
    RegisterAgentRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        bio:
          type: string
        wallet_address:
          type: string
    UpdateAgentRequest:
      type: object
      properties:
        bio:
          type: string
        displayName:
          type: string
        walletAddress:
          type: string
    AgentCard:
      type: object
      required:
      - name
      - url
      properties:
        name:
          type: string
        url:
          type: string
        skills:
          type: array
          items:
            type: object
