source: live probes of /.well-known/ on every host the record knows
summary: >-
  Two real documents are served on the apex host: an OpenAI-style /.well-known/ai-plugin.json (auth none,
  api.type openapi pointing at https://canfly.ai/api/openapi.json) and a provider MCP manifest at
  /.well-known/mcp.json (endpoint https://canfly.ai/mcp, streamable-http, protocol 2025-03-26). Both are
  application/json and both are checked into the provider's public repo under public/.well-known/. That is
  a genuine WellKnown hit and the pointer is earned. Nothing else is served: no security.txt (NO SecurityTxt
  pointer), no api-catalog, no OIDC discovery, no OAuth authorization-server or protected-resource metadata,
  and no A2A card at either well-known path.
pointer_basis: WellKnown pointer emitted on the strength of the two application/json 200s on canfly.ai. SecurityTxt NOT emitted.
false_positive_watch: >-
  canfly.ai is a Cloudflare Pages SPA with a catch-all: every unknown path — including every unserved
  /.well-known/* path — answers HTTP 200 text/html with the same 6,668-byte marketing shell (www.canfly.ai
  serves a 6,439-byte variant of the same). A genuine 404 exists (779-byte text/html body, status 404, e.g.
  /openapi.yaml, /changelog) but the /.well-known/ prefix is routed to the SPA, not to the 404. Every
  text/html 200 below is therefore a MISS. The domain also has a wildcard DNS record: api., docs., mcp.,
  app. and status.canfly.ai all resolve and serve the same shell; none is a distinct host.
